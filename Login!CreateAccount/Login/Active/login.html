<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <link rel="stylesheet" href="../../../assets/node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./main.css">
</head>

<body>
    <div class="login">
        <div class="logo">
            <img src="../../../assets/logo.png" alt="">
        </div>

        <div class="main">
            <div class="top">
                <h4>Login</h4>
                <p>Add your details below to get back into the app</p>
            </div>
            <form action="">
                <label for="">Email address</label>
                <div class="inp-box">
                    <img src="../../../assets/email.png" alt="">
                    <input class="w-100 email-input" type="text" placeholder="soni6789@email.com">
                    <div class=" position-absolute khat">|</div>
                </div>
                <label for="">Password</label>
                <div class="inp-box">
                    <img src="../../../assets/lock.svg" alt="">
                    <input class="w-100 password-input" type="password" placeholder="Enter your password">
                </div>

            </form>
            <button class="w-100">Login</button>
            <div class="bottom">
                <span>Don’t have an account?</span><a href="#"> Create account</a>
            </div>
        </div>
    </div>


    <script src="../../../assets/node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>

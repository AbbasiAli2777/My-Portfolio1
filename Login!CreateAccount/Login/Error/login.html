<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link rel="stylesheet" href="../../../assets/node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./main.css">
</head>

<body>

    <div class="login">
        <div class="logo">
            <img src="../../../assets/logo.png" alt="">
        </div>
        <div class="main">
            <div class="top">
                <h4>Login</h4>
                <p>Add your details below to get back into the app</p>
            </div>
            <form>
                <label>Email address</label>
                <div class="inp-box">
                    <img src="../../../assets/email.png" alt="">
                    <input class="w-100" type="email" placeholder="e.g. alex@email.com">
                    <div class="war">Can’t be empty</div>
                </div>
                <label>Password</label>
                <div class="inp-box">
                    <img src="../../../assets/lock.svg" alt="">
                    <input class="w-100" type="password" placeholder="Enter your password">
                    <div class="war">Please check again</div>
                </div>
            </form>
            <button class="w-100">Login</button>
            <div class="bottom">
                <span>Don’t have an account?</span>
                <a href="#">Create account</a>
            </div>
        </div>
    </div>

    <script src="../../../assets/node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>

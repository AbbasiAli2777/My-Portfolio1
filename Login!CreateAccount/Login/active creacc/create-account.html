<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>create account</title>
    <link rel="stylesheet" href="../../../assets/node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./main.css">
</head>

<body>
    <div class="login">
        <div class="logo">
            <img src="../../../assets/logo.png" alt="">
        </div>

        <div class="main">
            <div class="top">
                <h4>Create account</h4>
                <p>Let’s get you started sharing your links!</p>
            </div>
            <form action="">
                <label for="">Email address</label>
                <div class="inp-box">
                    <img src="../../../assets/email.png" alt="">
                    <input class="w-100" type="text" placeholder="soni6786gmail@.com">
                    <div class=" position-absolute khat">|</div>
                </div>

                <label for="">Create password</label>
                <div class="inp-box">
                    <img src="../../../assets/lock.svg" alt="">
                    <input class="w-100" type="password" placeholder="•••••••••••••••••">
                </div>

                <label for="">Confirm password</label>
                <div class="inp-box">
                    <img src="../../../assets/lock.svg" alt="">
                    <input class="w-100" type="password" placeholder="•••••••••••••••••">
                </div>
            </form>
            <div class="text-boinp">Password must contain at least 8 characters</div>
            <button class="w-100">Create new account</button>
            <div class="bottom">
                <span>Already have an account? </span><a href="#">Login</a>
            </div>
        </div>
    </div>


    <script src="../../../assets/node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
